name: Generate XoDos-Ark Ubuntu 26.04 Rootfs

on:
  workflow_dispatch: # Allows you to trigger this manual compilation with a single click button

jobs:
  build-rootfs-directory:
    runs-on: ubuntu-26.04-arm # Leverages your chosen high-performance native ARM64 cloud instances
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap xz-utils

      - name: Execute Core mmdebstrap Generation
        run: |
          # Creates a flawless Ubuntu 26.04 Resolute rootfs directory tree natively matching ports paths
          sudo mmdebstrap --variant=minbase resolute ./rootfs "http://ports.ubuntu.com/"

      - name: Upload Raw Directory Tree for XoDos Import
        uses: actions/upload-artifact@v4
        with:
          name: xodos-uncompressed-rootfs-tree
          path: ./rootfs
          include-hidden-files: true # Guarantees that essential system files like .asoundrc are preserved
