name: Generate XoDos-Ark Ubuntu 26.04 Rootfs

on:
  workflow_dispatch: # Allows you to trigger this manual compilation with a single click button

jobs:
  build-rootfs-directory:
    runs-on: ubuntu-26.04-arm # Leverages your chosen high-performance native ARM64 cloud instances
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap xz-utils

      - name: Execute Core mmdebstrap Generation
        run: |
          # Creates a flawless Ubuntu 26.04 Plucky rootfs directory tree natively matching ports paths
          sudo mmdebstrap --variant=minbase plucky ./rootfs "http://ports.ubuntu.com/"

            - name: Compress Directory for XoDos Import
             run: |
          # Packs the rootfs directory quietly into your required clean tarball distribution package 
          sudo tar -cf xodos-ubuntu-26.04.tar.xz -C ./rootfs .

      - name: Upload Distribution Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: xodos-ready-ubuntu-rootfs
          path: ./xodos-ubuntu-26.04.tar.xz
          compression-level: 0 # Bypasses redundant re-compression passes since xz handles it
