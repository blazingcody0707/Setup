name: Convert Flatpak Bundle into Universal Rootless Tarball

on:
  workflow_dispatch: # Allows you to manually trigger this build anytime via the GitHub web interface!

jobs:
  convert_flatpak:
    name: Run Cloud Extraction Loop
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository Context
        uses: actions/checkout@v4

      - name: Convert Flatpak Bundle into Universal Rootless Tarball
        run: |
          # 1. Install desktop-grade ostree utility tools onto the cloud runner
          sudo apt-get update && sudo apt-get install -y ostree
          
          # 2. Initialize a genuine bare repository database layout on the server
          ostree --repo=./cloud_repo init --mode=bare-user
          
          # 3. Pull down the official 18.32MB package bundle straight to the cloud disk
          wget -q https://dl.dolphin-emu.org/releases/2606/dolphin-2606-aarch64.flatpak
          
          # 4. Import the static delta blocks and force checkout the pure user-space files
          ostree --repo=./cloud_repo static-delta apply-offline ./dolphin-2606-aarch64.flatpak
          ostree --repo=./cloud_repo checkout -U a6d8d35e7a8e999d4964f2490eb023e45a9d7f7d6593f980378bb6c2efb485fc ./dolphin_extracted
          
          # 5. Pack the pristine emulator filesystem straight into a standard compressed TAR package!
          tar -czf dolphin_files.tar.gz -C ./dolphin_extracted/files/ .
          
      - name: Upload Clean Emulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-native-arm64
          path: dolphin_files.tar.gz
